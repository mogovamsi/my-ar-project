<!DOCTYPE html>
<html>
  <head>
    <title>My Classroom WebAR</title>
    <!-- Load A-Frame 3D library -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- Load AR.js library -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">

    <a-scene vr-mode-ui="enabled: false;" embedded arjs>
      <!-- Preload Local Audio Asset -->
      <a-assets>
        <!-- Reference your uploaded file directly by name -->
        <audio id="my-sound" src="hiro.mp3" preload="auto"></audio>
      </a-assets>

      <!-- Target Marker (Hiro) -->
      <a-marker preset="hiro" id="marker">
        
        <!-- 3D Red Box with Spinning Animation -->
        <a-box 
          position="0 0.5 0" 
          color="red" 
          animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
        </a-box>

        <!-- Sound Entity Connected to Asset -->
        <a-entity sound="src: #hiro; autoplay: false"></a-entity>

      </a-marker>

      <!-- Camera Entity -->
      <a-entity camera></a-entity>
    </a-scene>

    <!-- Script to Trigger Audio when Marker is Visible -->
    <script>
      window.addEventListener('load', () => {
        const marker = document.querySelector('#marker');
        const sound = document.querySelector('a-entity[sound]');

        // Play sound when Hiro marker appears in camera
        marker.addEventListener('markerFound', () => {
          sound.components.sound.playSound();
        });

        // Pause sound when Hiro marker leaves camera
        marker.addEventListener('markerLost', () => {
          sound.components.sound.pauseSound();
        });
      });
    </script>

  </body>
</html>
