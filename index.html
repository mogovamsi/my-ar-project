<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Classroom WebAR</title>
    <!-- Stable A-Frame library -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <!-- Stable AR.js library -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">

    <a-scene 
      embedded 
      vr-mode-ui="enabled: false;" 
      xr-mode-ui="enabled: false;"
      arjs="sourceType: webcam; debugUIEnabled: false;">

      <!-- Preload Media Assets -->
      <a-assets>
        <!-- 1. Audio Asset -->
        <audio id="my-sound" src="hiro.mp3" preload="auto"></audio>
        
        <!-- 2. 3D Model Asset (Upload dinosaur.glb to your GitHub repository) -->
        <a-asset-item id="my-model" src="chicken.glb"></a-asset-item>
      </a-assets>

      <!-- Target Marker (Hiro) -->
      <a-marker preset="hiro" id="marker">
        
        <!-- Render 3D Model -->
        <a-gltf-model 
          src="#my-model" 
          position="0 0 0" 
          scale="0.5 0.5 0.5" 
          rotation="0 0 0">
        </a-gltf-model>

        <!-- Sound Entity -->
        <a-entity sound="src: #my-sound; autoplay: false"></a-entity>

      </a-marker>

      <!-- Camera -->
      <a-entity camera></a-entity>
    </a-scene>

    <!-- Audio Control Script -->
    <script>
      window.addEventListener('load', () => {
        const marker = document.querySelector('#marker');
        const sound = document.querySelector('a-entity[sound]');

        marker.addEventListener('markerFound', () => {
          sound.components.sound.playSound();
        });

        marker.addEventListener('markerLost', () => {
          sound.components.sound.pauseSound();
        });
      });
    </script>

  </body>
</html>
